[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "deepfix-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "deepagents>=0.7,<0.8",
  "httpx>=0.27,<1",
  "langchain-deepseek>=1,<2",
  "langgraph-checkpoint-sqlite>=3,<4",
  "packaging>=24,<27",
  "pydantic>=2,<3",
  "python-dotenv>=1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[project.scripts]
deepfix = "deepfix.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -m 'not online'"
markers = [
  "online: accesses only approved public endpoints and requires DEEPFIX_RUN_ONLINE=1",
]

[tool.ruff]
line-length = 100
target-version = "py311"
